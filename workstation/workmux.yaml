# Canonical workmux config (single source of truth).
# Symlinked to ~/.config/workmux/config.yaml by ./install.
# Used by:
#   - workmux itself (worktree windows)
#   - linux/tmux-layout (default workspace session, via yq)

nerdfont: true

# Fixed width avoids the dynamic reflow-on-resize sidebar bug present in
# workmux <= 0.1.209 (width drifted between 10/38/67 cols across windows).
# layout: compact keeps every window's sidebar at 1 line/agent regardless of
# what 'v' was last pressed in that window (the runtime toggle doesn't persist).
sidebar:
  width: 40
  layout: compact

# workmux per-worktree window layout (used by `workmux open`/`add`):
# a single pane running the resume-or-start agent. Sidebar is separate.
agent: clau
panes:
  - command: <agent>

# Default tmux "workspace" window layout, read by linux/tmux-layout via yq
# (NOT by workmux). Kept as the dashboard + git-status home base. Decoupled
# from `panes:` so the worktree `open` stays clean while the workspace keeps
# its multi-pane layout.
workspace_panes:
  - command: workmux dashboard
  - split: horizontal
    percentage: 70
    focus: true
  - command: git status
    split: vertical
    target: 0
    percentage: 30
theme: phosphor-arcade
