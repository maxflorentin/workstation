# tmux config

# ── TPM (Tmux Plugin Manager) ──────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'aomerk/tmux-claude-sessions'
set -g @plugin 'artischocki/agent-usage-tmux'

# Claude sessions: prefix + g to browse/resume conversations
# set -g @claude_sessions_key 'g'
# set -g @claude_sessions_popup_width '80%'
# set -g @claude_sessions_popup_height '75%'

# agent-usage-tmux override: el fetch upstream lee ~/.claude/.credentials.json
# (no existe en macOS, donde el OAuth vive en Keychain) y no soporta el claim
# `overage`. Nuestro script en dotfiles cubre ambos casos y cachea 60s.
set -g @agent_usage_cmd_claude '~/.dotfiles/scripts/claude-usage'
set -g @agent_usage_reset_cmd_claude '~/.dotfiles/scripts/claude-usage --field reset_in'

# True color + cursor style support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",*:Ss=\\E[%p1%d q:Se=\\E[5 q"

# Cursor: blinking bar (pipe) by default
set -ga terminal-overrides ",*:Cs=\\E]12;%p1%s\\007"

# Key passthrough
set -gw xterm-keys on
set -s extended-keys on

# General
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -s escape-time 0
set -g renumber-windows on
set -g focus-events on
setw -g mode-keys vi
set -g set-clipboard on
set -g detach-on-destroy off

# ── Mouse selection → system clipboard ──────────
# Rely on tmux's built-in OSC52 support (set-clipboard on, above) instead of
# piping to a host-side clipboard tool: OSC52 goes straight to the local
# terminal over the SSH connection, no xclip/wl-copy/pbcopy or X server
# needed on the remote end. Mouse drag and copy-mode y/Enter use tmux's
# default copy-selection-and-cancel, which already emits OSC52.

# Toggle mouse mode: Prefix + M (capital M, i.e. Shift+m)
# Useful when you need native terminal selection for copying text.
bind M set -g mouse \; display-message "mouse #{?mouse,ON,OFF}"

# ── Mobile mode (narrow SSH clients, e.g. WebSSH) ────
# On attach, auto-detect a narrow client (phone terminal) and drop the
# status bar + zoom the current pane to reclaim the little horizontal room
# there is. Self-heals on every reattach, which matters for SSH-only mobile
# clients (no mosh) that drop the connection on network handoff.
# Manual override: Prefix + m.
set-hook -g client-attached 'run-shell "~/.dotfiles/scripts/tmux-mobile-mode #{client_width}"'
bind m run-shell "~/.dotfiles/scripts/tmux-mobile-mode toggle"

# Prefix: keep Ctrl-b working, add Ctrl-a as the faster daily prefix.
set -g prefix C-a
set -g prefix2 C-b
bind C-a send-prefix
bind C-b send-prefix

# ── Status: compact but useful ──────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#041821,fg=#a7d4e3"
set -g status-left-length 60
set -g status-right-length 120
set -g status-left "#[fg=#8fd0e6,bold] #(~/.dotfiles/scripts/tmux-repo-context \"#{pane_current_path}\") #{?client_prefix,#[fg=#041821]#[bg=#ff5d7a]#[bold] prefix #[default],}"
set -g status-right "#{?pane_synchronized,#[fg=#041821]#[bg=#ff5d7a]#[bold] sync #[default],}#{agent_usage} #[fg=#3f96b4]#(cd \"#{pane_current_path}\" 2>/dev/null && git branch --show-current 2>/dev/null) #(~/.dotfiles/scripts/tmux-sysmon) #[fg=#8fd0e6,bold]%H:%M #[fg=#4f8ba3]#H "
setw -g window-status-format "#[fg=#4f8ba3] #I:#W "
setw -g window-status-current-format "#[fg=#041821,bg=#72b4c9,bold] #I:#W "
setw -g window-status-activity-style "fg=#ffd27a"
setw -g window-status-bell-style "fg=#ff5d7a,bold"

# Pane borders: visible enough to orient the layout without competing with code.
set -g pane-border-lines single
set -g pane-border-status off
set -g pane-border-style "fg=#123c4f"
set -g pane-active-border-style "fg=#8fd0e6"

# Selection (copy mode) and tmux messages, matching the status bar palette.
set -g mode-style "fg=#041821,bg=#72b4c9"
set -g message-style "fg=#a7d4e3,bg=#0a2a38,bold"
set -g message-command-style "fg=#a7d4e3,bg=#0a2a38"

# ── Tau-like workflow helpers ───────────────────
bind f display-popup -E -w 85% -h 80% 'tmux-sessionizer'
bind G display-popup -E -w 90% -h 85% -d "#{pane_current_path}" 'command -v lazygit >/dev/null 2>&1 && lazygit || git status'
bind D display-popup -E -w 90% -h 85% -d "#{pane_current_path}" 'workmux dashboard'
bind e display-popup -E -w 90% -h 85% -d "#{pane_current_path}" '${EDITOR:-nvim}'
bind s display-popup -E -w 80% -h 70% -d "#{pane_current_path}" '${SHELL:-zsh}'
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Splits inherit the current pane directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Prefix-less pane navigation. Neovim handles these itself when focused.
bind -n C-h if-shell 'ps -o comm= -t "#{pane_tty}" | grep -iqE "n?vim|view|fzf"' 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell 'ps -o comm= -t "#{pane_tty}" | grep -iqE "n?vim|view|fzf"' 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell 'ps -o comm= -t "#{pane_tty}" | grep -iqE "n?vim|view|fzf"' 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell 'ps -o comm= -t "#{pane_tty}" | grep -iqE "n?vim|view|fzf"' 'send-keys C-l' 'select-pane -R'

# Faster window/session movement without reaching for the prefix.
bind -n M-h previous-window
bind -n M-l next-window
bind -n M-H switch-client -p
bind -n M-L switch-client -n

# ── Time tracking ────────────────────────────────
# Pulse-based: cron runs `work-tracker pulse` every 5 min
# which checks #{session_activity} to detect real activity

# ── TPM init (keep at bottom) ───────────────────
if-shell '[ -d ~/.tmux/plugins/tpm ]' 'run ~/.tmux/plugins/tpm/tpm'
