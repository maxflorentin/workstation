"$schema" = 'https://starship.rs/config-schema.json'

# Avoid warnings in large repos while keeping slow prompt modules bounded.
scan_timeout = 100
command_timeout = 500
right_format = "$status$jobs${custom.tmux}$time"

format = """
$directory\
$git_branch\
$git_state\
$git_status\
$cmd_duration\
$line_break\
$python\
$character"""

[directory]
style = "cyan"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "bright-black"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = "[$virtualenv]($style) "
style = "bright-black"
detect_extensions = []
detect_files = []

[status]
disabled = false
format = "[$status]($style) "
style = "red"

[jobs]
format = "[$number jobs]($style) "
style = "yellow"
number_threshold = 1

[time]
disabled = false
format = "[$time]($style)"
style = "bright-black"
time_format = "%H:%M"

[custom.tmux]
when = 'test -n "$TMUX"'
command = 'tmux display-message -p "#S:#I.#P" 2>/dev/null'
format = "[$output]($style) "
style = "bright-black"
