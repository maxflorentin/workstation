# Public DNS for the media containers.
#
# The workstation runs Tailscale with MagicDNS, so the host's /etc/resolv.conf
# is `nameserver 127.0.0.1` (Tailscale's local resolver). Docker can't hand a
# loopback resolver to containers, so it substitutes the Tailscale MagicDNS IP
# (100.100.100.100) — which has no global upstream configured and times out for
# public domains. That breaks Plex's ability to reach plex.tv (claim fails) and
# torrent trackers/feeds.
#
# This file is bind-mounted into Plex (which uses network_mode: host, where
# docker-compose's `dns:` option is ignored). Bridge services use `dns:` in the
# compose file instead, so they keep Docker's embedded resolver (127.0.0.11) for
# inter-container name resolution while forwarding public queries here.
nameserver 1.1.1.1
nameserver 8.8.8.8
