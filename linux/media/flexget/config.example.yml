# Flexget config. `media setup` copies this to $CONFIG/flexget/config.yml
# (host-local) if none exists. Edit it THERE, not here — this stays a template.
#
# Docs: https://flexget.com/Configuration
#
# Transmission runs as a sibling container; reach it by service name on the
# compose network. Keep the credentials below in sync with
# TRANSMISSION_USER/TRANSMISSION_PASS in .env.
#
# NOTE: `tasks:` must be a non-empty mapping or the daemon fails schema
# validation and crash-loops. The disabled placeholder below keeps it valid
# until you add real feeds.

templates:
  global:
    transmission:
      host: transmission
      port: 9091
      username: admin          # match TRANSMISSION_USER
      password: changeme       # match TRANSMISSION_PASS
      path: /downloads

tasks:
  # Harmless placeholder so the config validates. Produces one mock entry and
  # accepts nothing, so it does nothing. Replace with your real RSS feeds, e.g.:
  #   my-feed:
  #     rss: https://example.com/feed.rss
  #     accept_all: yes
  #     download: /downloads
  placeholder:
    mock:
      - title: placeholder
    disable: builtins

schedules:
  - tasks: ['*']
    interval:
      hours: 1
