# Media stack for the workstation (Dell Latitude E7470, x86_64).
#
# Adapted from https://github.com/pablokbs/plex-rpi (originally ARM/Raspberry Pi):
#   - Plex/Transmission use amd64 linuxserver.io images instead of ARM ones.
#   - Resource limits cap each service so it never starves the work containers
#     on this 2-core / 4-thread box (see `que no me coma mucho`).
#   - Log rotation prevents container logs from filling the disk.
#
# Paths, credentials and the optional Plex claim token live in a host-local
# .env next to this file (see .env.example). `media setup` seeds it.
#
# Lifecycle: use the `media` CLI (media up | down | status | logs ...).

name: media

services:

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: media-plex
    # Host networking is recommended by Plex for GDM/DLNA discovery and works
    # on Linux. It also avoids mapping Plex's many ports by hand.
    network_mode: host
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - VERSION=docker
      # First-run only: grab a token at https://plex.tv/claim (valid ~4 min).
      - PLEX_CLAIM=${PLEX_CLAIM}
    volumes:
      - ${CONFIG}/plex:/config
      - ${MEDIA}:/media
      - ${TRANSCODE}:/transcode
      # Working public DNS: host net makes compose's `dns:` a no-op, and the
      # host's Tailscale resolver (100.100.100.100) can't resolve plex.tv.
      - ./resolv.conf:/etc/resolv.conf:ro
    # Hardware transcoding (Intel QuickSync) needs Plex Pass. You chose direct
    # play, so it stays off. To enable later: get Plex Pass, uncomment below,
    # and set the transcoder to use HW acceleration in Plex settings.
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  samba:
    image: dperson/samba
    container_name: media-samba
    dns: ["1.1.1.1", "8.8.8.8"]   # host resolver (Tailscale) can't resolve public names
    command: >-
      -u "${SAMBA_USER};${SAMBA_PASS}"
      -s "media;/media;yes;no;no;${SAMBA_USER}"
      -s "downloads;/downloads;yes;no;no;${SAMBA_USER}"
    environment:
      - TZ=${TZ}
    ports:
      - "139:139"
      - "445:445"
    volumes:
      - ${MEDIA}:/media
      - ${STORAGE}/torrents:/downloads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: media-transmission
    dns: ["1.1.1.1", "8.8.8.8"]   # host resolver (Tailscale) can't resolve public names
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - USER=${TRANSMISSION_USER}
      - PASS=${TRANSMISSION_PASS}
    volumes:
      - ${CONFIG}/transmission:/config
      - ${STORAGE}/torrents:/downloads
      - ${STORAGE}/torrents/watch:/watch
    ports:
      - "9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # --- *arr stack: replaces Flexget for "tell hermes, it downloads" flow ---
  # Single ${STORAGE}:/data mount in sonarr/radarr so the download dir
  # (/data/torrents) and the library (/data/library/*) share one filesystem
  # device inside the container — required for instant hardlink imports from
  # Transmission instead of slow space-doubling copies. Transmission keeps its
  # own /downloads mount; a remote-path mapping (set via API) bridges the two
  # path views (transmission:/downloads -> sonarr:/data/torrents).

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: media-prowlarr
    dns: ["1.1.1.1", "8.8.8.8"]   # host resolver (Tailscale) can't resolve public names
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: media-sonarr
    dns: ["1.1.1.1", "8.8.8.8"]   # host resolver (Tailscale) can't resolve public names
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/sonarr:/config
      - ${STORAGE}:/data
    ports:
      - "8989:8989"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: media-radarr
    dns: ["1.1.1.1", "8.8.8.8"]   # host resolver (Tailscale) can't resolve public names
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/radarr:/config
      - ${STORAGE}:/data
    ports:
      - "7878:7878"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Subtitles companion for Sonarr/Radarr: downloads subs from multiple
  # providers for everything they import, and auto-syncs offset/drift against
  # the audio (ffsubsync). Same ${STORAGE}:/data view as sonarr/radarr, so no
  # path mappings are needed.
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: media-bazarr
    dns: ["1.1.1.1", "8.8.8.8"]   # host resolver (Tailscale) can't resolve public names
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/bazarr:/config
      - ${STORAGE}:/data
    ports:
      - "6767:6767"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Music: like sonarr/radarr but per artist/album. Same single /data mount
  # for hardlink imports (transmission /downloads -> /data/torrents mapping).
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: media-lidarr
    dns: ["1.1.1.1", "8.8.8.8"]   # host resolver (Tailscale) can't resolve public names
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/lidarr:/config
      - ${STORAGE}:/data
    ports:
      - "8686:8686"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Plex monitoring: watch history/stats and "new content added" notifications
  # (Telegram). Watches Plex directly over the host's Tailscale IP since Plex
  # runs on the host network.
  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: media-tautulli
    dns: ["1.1.1.1", "8.8.8.8"]   # host resolver (Tailscale) can't resolve public names
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG}/tautulli:/config
    ports:
      - "8181:8181"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Solves Cloudflare/DDoS-Guard challenges so Prowlarr can reach protected
  # indexers. Runs a headless Chromium, so it's the heaviest service when
  # active — capped accordingly. Prowlarr reaches it at http://flaresolverr:8191
  # (wired as an indexer proxy with the "flaresolverr" tag).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: media-flaresolverr
    dns: ["1.1.1.1", "8.8.8.8"]   # host resolver (Tailscale) can't resolve public names
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    ports:
      - "8191:8191"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
