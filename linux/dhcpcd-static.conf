# Static IPv4 for the workstation's WiFi, appended to /etc/dhcpcd.conf.
#
# Why: on 2026-11-06 the Deco stopped answering DHCP renewals; the lease
# expired (11:51), dhcpcd removed the IPv4 from wlp1s0 and the box went
# offline until a manual reboot. A static address does not depend on renewals.
#
# Pair with a DHCP reservation on the Deco (192.168.68.62 -> e4:a4:71:0a:bb:21)
# so the router never hands this IP to another device.
# DNS points at the local dnsmasq (linux/dnsmasq), which forwards to NextDNS.
#
# Apply (from the physical console, not SSH):
#   sudo cp /etc/dhcpcd.conf /etc/dhcpcd.conf.bak-$(date +%Y%m%d)
#   grep -q '^interface wlp1s0' /etc/dhcpcd.conf || sudo tee -a /etc/dhcpcd.conf < ~/.dotfiles/linux/dhcpcd-static.conf
#   sudo dhcpcd -n wlp1s0
# Revert: restore the .bak file and run `sudo dhcpcd -n wlp1s0`.

interface wlp1s0
static ip_address=192.168.68.62/22
static routers=192.168.68.1
static domain_name_servers=127.0.0.1
